name: Update e-Stat data

on:
  schedule:
    - cron: '0 18 1 * *' # 毎月1日 JST3:00 (UTC18:00 前日)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run fetch:population
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
      - run: npm run fetch:cancer-mortality
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
      - name: Commit updated data if changed
        run: |
          if git diff --quiet -- src/data/; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/
          git commit -m "chore: e-Statデータを自動更新"
          git push
